<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AirPlan</title>
    <link rel="stylesheet" href="styles.css"> <!-- Asegúrate de enlazar tu archivo CSS -->
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <ul>
                <li><a href="Airplan.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido de la página de registro -->
    <section id="registro">
        <h1>Crear una Cuenta</h1>

        <!-- Formulario de registro -->
        <form action="procesar_registro.php" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo">

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="Tu correo electrónico">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Tu contraseña">

            <label for="confirm-password">Confirmar Contraseña:</label>
            <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirma tu contraseña">

            <label for="telefono">Teléfono (opcional):</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Tu número de teléfono">

            <button type="submit">Crear Cuenta</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 AirPlan. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
